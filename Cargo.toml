[workspace]
resolver = "2"
members = [
    "crates/keld-core",
    "crates/keld-modules",
    "crates/keld-report",
    "crates/keld-tui",
    "crates/keld-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Leonardo Galli <https://github.com/Leo-Galli>"]
repository = "https://github.com/Leo-Galli/keld"
homepage = "https://github.com/Leo-Galli/keld"
readme = "README.md"

[workspace.dependencies]
keld-core = { path = "crates/keld-core" }
keld-modules = { path = "crates/keld-modules" }
keld-report = { path = "crates/keld-report" }
keld-tui = { path = "crates/keld-tui" }

anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive", "color", "wrap_help"] }
crossterm = "0.29.0"
dirs = "6.0.0"
insta = "1.49.0"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.21"
indicatif = "0.18.3"
socket2 = "0.6.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
toml = "0.8.23"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
